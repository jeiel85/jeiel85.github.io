name: Update Portfolio

on:
  schedule:
    # UTC 20:47 = KST 05:47. 정각은 GitHub 스케줄 실행이 몰려 몇 시간씩 밀리므로
    # 정각을 피한 분에 둔다(0 21 * * * 일 때 실제 실행은 KST 10:50 전후였음).
    - cron: '47 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps.json'
      - 'scripts/**'
      - '!scripts/cache.json'
      - '!scripts/github-cache.json'
      - 'index.html'
      - 'hermes-mail/**'
      - '.github/workflows/**'
  # PRs only verify that the build succeeds. The github-pages environment
  # accepts deployments from main only, so committing and deploying happen
  # in build-and-deploy, which never runs for pull requests.
  pull_request:
    paths:
      - 'apps.json'
      - 'scripts/**'
      - '!scripts/cache.json'
      - '!scripts/github-cache.json'
      - 'index.html'
      - 'hermes-mail/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  verify-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Build portfolio
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

  build-and-deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Build portfolio
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Commit updated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add apps.json index.html scripts/cache.json scripts/github-cache.json icons
          git diff --staged --quiet || git commit -m "chore: update portfolio data [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # Deploy in its own job, as in GitHub's Pages starter workflow. Deploying in
  # the same job a second after the upload hit "Found 0 artifact(s)" twice on
  # 2026-11-25: the artifact existed (API showed it) but was not yet listable
  # from the run. A job boundary gives the artifact service time to settle.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
