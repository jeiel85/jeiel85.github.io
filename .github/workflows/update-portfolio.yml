name: Update Portfolio

on:
  schedule:
    # UTC 21:00 = KST 06:00 (매일 한국시간 오전 6시)
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'apps.json'
      - 'scripts/build.js'
      - 'index.html'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Build portfolio
        working-directory: scripts
        run: npm run build

      - name: Commit updated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/cache.json icons
          git diff --staged --quiet || git commit -m "chore: update portfolio data [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
